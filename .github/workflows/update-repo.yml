name: Update Kodi Repository

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for upstream changes
        id: upstream
        run: |
          OMEGA_BRANCH=main
          PIERS_BRANCH=main
          echo "OMEGA_BRANCH=${OMEGA_BRANCH}" >> "$GITHUB_ENV"
          echo "PIERS_BRANCH=${PIERS_BRANCH}" >> "$GITHUB_ENV"

          CURRENT=""
          for BRANCH in $(printf '%s\n%s\n' "$OMEGA_BRANCH" "$PIERS_BRANCH" | sort -u); do
            for REPO in script.fentastic.helper skin.fentastic; do
              SHA=$(git ls-remote "https://github.com/fentastic-org/${REPO}" "refs/heads/${BRANCH}" | cut -f1)
              if [ -z "$SHA" ]; then
                echo "::error::Branch ${BRANCH} not found in ${REPO}"
                exit 1
              fi
              CURRENT="${CURRENT}${REPO}@${BRANCH}=${SHA}:"
            done
          done
          REPO_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('src/repository.fentastic/addon.xml').getroot().get('version'))")
          CURRENT="${CURRENT}repository.fentastic=${REPO_VERSION}"

          echo "Current upstream: $CURRENT"

          if [ -f .last-upstream-shas ] && [ "$(cat .last-upstream-shas)" = "$CURRENT" ]; then
            echo "No upstream changes detected, skipping update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CURRENT" > .last-upstream-shas
          fi

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: pip install gitpython

      - name: Fetch add-on sources
        if: steps.upstream.outputs.changed == 'true'
        run: |
          for BRANCH in $(printf '%s\n%s\n' "$OMEGA_BRANCH" "$PIERS_BRANCH" | sort -u); do
            for REPO in script.fentastic.helper skin.fentastic; do
              git clone -q --depth 1 --branch "$BRANCH" \
                "https://github.com/fentastic-org/${REPO}" "build/${BRANCH}/${REPO}"
              rm -rf "build/${BRANCH}/${REPO}/.git"
            done
          done

      - name: Build legacy flat catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files \
            src/repository.fentastic \
            "build/${OMEGA_BRANCH}/script.fentastic.helper" \
            "build/${OMEGA_BRANCH}/skin.fentastic"

      - name: Build Omega catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files/omega \
            src/repository.fentastic \
            "build/${OMEGA_BRANCH}/script.fentastic.helper" \
            "build/${OMEGA_BRANCH}/skin.fentastic"

      - name: Build Piers catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files/piers \
            src/repository.fentastic \
            "build/${PIERS_BRANCH}/script.fentastic.helper" \
            "build/${PIERS_BRANCH}/skin.fentastic"

      - name: Prune superseded versions
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/prune_old_versions.py files files/omega files/piers

      - name: Publish add-on artwork
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/copy_addon_assets.py files files/omega files/piers

      - name: Pack repository add-on zip for manual download
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/zip_repo.py

      - name: Commit and push changes
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A files/ .last-upstream-shas index.html "repository.fentastic-*.zip"
          git diff --staged --quiet && exit 0
          git commit -m "Update repository add-ons"
          git push
