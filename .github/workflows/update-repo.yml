name: Update Kodi Repository

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for upstream changes
        id: upstream
        run: |
          HELPER_BRANCH=main
          SKIN_OMEGA_BRANCH=omega
          SKIN_PIERS_BRANCH=piers
          echo "HELPER_BRANCH=${HELPER_BRANCH}" >> "$GITHUB_ENV"
          echo "SKIN_OMEGA_BRANCH=${SKIN_OMEGA_BRANCH}" >> "$GITHUB_ENV"
          echo "SKIN_PIERS_BRANCH=${SKIN_PIERS_BRANCH}" >> "$GITHUB_ENV"

          CURRENT=""
          for SRC in \
            "script.fentastic.helper@${HELPER_BRANCH}" \
            "skin.fentastic@${SKIN_OMEGA_BRANCH}" \
            "skin.fentastic@${SKIN_PIERS_BRANCH}"; do
            REPO=${SRC%@*}
            BRANCH=${SRC#*@}
            SHA=$(git ls-remote "https://github.com/fentastic-org/${REPO}" "refs/heads/${BRANCH}" | cut -f1)
            if [ -z "$SHA" ]; then
              echo "::error::Branch ${BRANCH} not found in ${REPO}"
              exit 1
            fi
            CURRENT="${CURRENT}${REPO}@${BRANCH}=${SHA}:"
          done
          REPO_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('src/repository.fentastic/addon.xml').getroot().get('version'))")
          CURRENT="${CURRENT}repository.fentastic=${REPO_VERSION}"

          echo "Current upstream: $CURRENT"

          if [ -f .last-upstream-shas ] && [ "$(cat .last-upstream-shas)" = "$CURRENT" ]; then
            echo "No upstream changes detected, skipping update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CURRENT" > .last-upstream-shas
          fi

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: pip install gitpython

      - name: Fetch add-on sources
        if: steps.upstream.outputs.changed == 'true'
        run: |
          fetch() {
            git clone -q --depth 1 --branch "$2" \
              "https://github.com/fentastic-org/$1" "$3"
            rm -rf "$3/.git"
          }
          fetch script.fentastic.helper "$HELPER_BRANCH"     build/helper
          fetch skin.fentastic          "$SKIN_OMEGA_BRANCH" build/skin-omega
          fetch skin.fentastic          "$SKIN_PIERS_BRANCH" build/skin-piers

      - name: Build Omega catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files/omega \
            src/repository.fentastic \
            build/helper \
            build/skin-omega

      - name: Build Piers catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files/piers \
            src/repository.fentastic \
            build/helper \
            build/skin-piers

      - name: Prune superseded versions
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/prune_old_versions.py files/omega files/piers

      - name: Publish add-on artwork
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/copy_addon_assets.py files/omega files/piers

      - name: Pack repository add-on zip for manual download
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/zip_repo.py

      - name: Commit and push changes
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A files/ .last-upstream-shas index.html "repository.fentastic-*.zip"
          git diff --staged --quiet && exit 0
          git commit -m "Update repository add-ons"
          git push
