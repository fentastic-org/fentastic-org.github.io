name: Update Kodi Repository

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for upstream changes
        id: upstream
        run: |
          # Branch each Kodi target builds from. Today Omega and Piers share
          # one branch; when Piers needs a breaking change, cut an `omega`
          # branch off main and point OMEGA_BRANCH at it. Change-detection
          # below tracks whatever branches these name, so a divergent branch
          # still triggers rebuilds.
          OMEGA_BRANCH=main
          PIERS_BRANCH=main
          echo "OMEGA_BRANCH=${OMEGA_BRANCH}" >> "$GITHUB_ENV"
          echo "PIERS_BRANCH=${PIERS_BRANCH}" >> "$GITHUB_ENV"

          # Get latest commit SHAs for every branch we build from
          CURRENT=""
          for BRANCH in $(printf '%s\n%s\n' "$OMEGA_BRANCH" "$PIERS_BRANCH" | sort -u); do
            for REPO in script.fentastic.helper skin.fentastic; do
              SHA=$(git ls-remote "https://github.com/fentastic-org/${REPO}" "refs/heads/${BRANCH}" | cut -f1)
              if [ -z "$SHA" ]; then
                echo "::error::Branch ${BRANCH} not found in ${REPO}"
                exit 1
              fi
              CURRENT="${CURRENT}${REPO}@${BRANCH}=${SHA}:"
            done
          done
          # Rebuild when the repo add-on itself is bumped, not just on upstream commits
          REPO_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('files/repository.fentastic/addon.xml').getroot().get('version'))")
          CURRENT="${CURRENT}repository.fentastic=${REPO_VERSION}"

          echo "Current upstream: $CURRENT"

          # Compare against last known state
          if [ -f .last-upstream-shas ] && [ "$(cat .last-upstream-shas)" = "$CURRENT" ]; then
            echo "No upstream changes detected, skipping update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CURRENT" > .last-upstream-shas
          fi

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: pip install gitpython

      # Legacy flat catalog. repository.fentastic 1.0.1 shipped with these paths
      # hardcoded, so they must keep working until installs of it die out --
      # this is the only channel through which 1.0.1 clients can reach 1.0.2.
      - name: Build legacy flat catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files \
            files/repository.fentastic \
            https://github.com/fentastic-org/script.fentastic.helper \
            https://github.com/fentastic-org/skin.fentastic

      - name: Build Omega catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files/omega \
            files/repository.fentastic \
            "https://github.com/fentastic-org/script.fentastic.helper#${OMEGA_BRANCH}" \
            "https://github.com/fentastic-org/skin.fentastic#${OMEGA_BRANCH}"

      - name: Build Piers catalog
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python scripts/create_repository.py \
            --datadir=files/piers \
            files/repository.fentastic \
            "https://github.com/fentastic-org/script.fentastic.helper#${PIERS_BRANCH}" \
            "https://github.com/fentastic-org/skin.fentastic#${PIERS_BRANCH}"

      - name: Pack repository add-on zip for manual download
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/zip_repo.py

      - name: Commit and push changes
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/ .last-upstream-shas index.html repository.fentastic-*.zip
          # Check if there's anything to commit
          git diff --staged --quiet && exit 0
          git commit -m "Update repository add-ons"
          git push
